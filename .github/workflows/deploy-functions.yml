name: Deploy NovelInk Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa_key.json

      - name: Deploy to Firebase
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa_key.json
          firebase deploy --only functions --project novelink-b0958 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa_key.json

      - name: Cleanup
        if: always()
        run: rm -f sa_key.json

      - name: Done
        run: echo "✅ Déployé!"
